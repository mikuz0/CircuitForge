<?xml version="1.0" encoding="UTF-8"?>
<!-- Конденсатор: 80×50, пластины вертикальные, ножки слева/справа -->
<svg xmlns="http://www.w3.org/2000/svg" width="80" height="50" viewBox="-40 -25 80 50">
  <!-- Левая ножка -->
  <line x1="-40" y1="0" x2="-12.5" y2="0" stroke="black" stroke-width="2"/>
  <!-- Правая ножка -->
  <line x1="12.5" y1="0" x2="40" y2="0" stroke="black" stroke-width="2"/>
  <!-- Левая пластина -->
  <line x1="-12.5" y1="-20" x2="-12.5" y2="20" stroke="black" stroke-width="3"/>
  <!-- Правая пластина -->
  <line x1="12.5" y1="-20" x2="12.5" y2="20" stroke="black" stroke-width="3"/>
</svg>
