<?xml version="1.0" encoding="UTF-8"?>
<!-- Резистор: 80×40, ножки на x = ±40 -->
<svg xmlns="http://www.w3.org/2000/svg" width="80" height="40" viewBox="-40 -20 80 40">
  <!-- Левая ножка -->
  <line x1="-40" y1="0" x2="-15" y2="0" stroke="black" stroke-width="2"/>
  <!-- Правая ножка -->
  <line x1="15" y1="0" x2="40" y2="0" stroke="black" stroke-width="2"/>
  <!-- Тело резистора (прямоугольник) -->
  <rect x="-15" y="-10" width="30" height="20" fill="none" stroke="black" stroke-width="2"/>
</svg>
